name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  # convert_icons.py prints emoji, which the Windows console encoding cannot handle
  PYTHONUTF8: "1"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install system packages (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install create-dmg cairo
          # cairosvg loads libcairo through dyld; Homebrew installs it outside the default search path
          echo "DYLD_FALLBACK_LIBRARY_PATH=$(brew --prefix)/lib" >> "$GITHUB_ENV"

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev patchelf

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # The install location is not fixed on the runner image, so look it up
          $exe = Get-ChildItem -Path 'C:\Program Files (x86)', 'C:\Program Files' -Recurse -Depth 2 -Filter makensis.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw 'makensis.exe not found after installing NSIS' }
          "MAKENSIS=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" zstandard ordered-set

      - name: Generate icons
        # Cairo is not available on the Windows runner, so icon generation can fail there.
        # The Windows build then runs without an icon, which the build script allows.
        shell: bash
        run: |
          python scripts/convert_icons.py || echo "Icon generation failed; continuing without generated icons"

      - name: Build macOS app and DMG
        if: runner.os == 'macOS'
        run: |
          ./build_macos_nuitka.sh
          ./scripts/create_dmg.sh

      - name: Build Linux app and archive
        if: runner.os == 'Linux'
        run: |
          ./build_linux_nuitka.sh
          tar -C dist -czf dist/Keisanbako-0.1.0-linux-x86_64.tar.gz Keisanbako

      - name: Build Windows app and installer
        if: runner.os == 'Windows'
        shell: bash
        run: |
          ./build_windows_nuitka.sh
          "$(cygpath -u "$MAKENSIS")" \
            /DDISTDIR="$(cygpath -w "$PWD/dist")" \
            windows/Keisanbako.nsi

      - uses: actions/upload-artifact@v7
        with:
          name: keisanbako-${{ matrix.name }}
          path: dist/Keisanbako-0.1.0*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create release with all platform builds
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Keisanbako ${GITHUB_REF_NAME#v}" \
            --generate-notes
